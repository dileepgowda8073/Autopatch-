[project]
name = "autopatch-backend"
version = "0.1.0"
description = "AutoPatch - Autonomous Software Bug Detection and Repair System Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "ruff>=0.4.8",
    "bandit>=1.7.8",
    "pytest>=8.2.0",
    "sse-starlette>=2.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
